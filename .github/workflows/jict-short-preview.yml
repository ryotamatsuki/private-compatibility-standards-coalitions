name: JICT Short Manuscript Preview

on:
  pull_request:
    paths:
      - 'paper/jict_short/**'
      - 'code/revision/build_jict_short.py'
      - 'code/revision/make_jict_short_figure.py'
      - 'code/revision/check_jict_short_independent.py'
      - 'code/revision/audit_jict_short_package.py'
      - 'submission/r9_final_polish/**'
      - '.github/workflows/jict-short-preview.yml'
  push:
    paths:
      - 'paper/jict_short/**'
      - 'code/revision/build_jict_short.py'
      - 'code/revision/make_jict_short_figure.py'
      - 'code/revision/check_jict_short_independent.py'
      - 'code/revision/audit_jict_short_package.py'
      - 'submission/r9_final_polish/**'
      - '.github/workflows/jict-short-preview.yml'

permissions:
  contents: read

jobs:
  short-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install LaTeX PDF source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils unzip
      - name: Generate reproducible figures and tables
        run: make figures tables
      - name: Compile manuscript, Appendix E proof bridges and Appendix G ledger
        run: python code/revision/build_jict_short.py
      - name: Clean-room short-source compilation
        run: |
          mkdir -p "${RUNNER_TEMP}/short-source-check"
          unzip -q submission/generated/jict_short_source.zip -d "${RUNNER_TEMP}/short-source-check"
          (cd "${RUNNER_TEMP}/short-source-check" && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex)
          PAGES=$(pdfinfo "${RUNNER_TEMP}/short-source-check/main.pdf" | awk '/^Pages:/ {print $2}')
          test "$PAGES" -ge 17
          test "$PAGES" -le 19
          ! pdftotext "${RUNNER_TEMP}/short-source-check/main.pdf" - | grep -F "Preprint submitted to Elsevier"
          pdftotext "${RUNNER_TEMP}/short-source-check/main.pdf" - | grep -F "ChatGPT (OpenAI)"
          echo "SHORT MANUSCRIPT CLEAN ROOM: PASS ($PAGES pages)"
      - name: Clean-room supplementary-source compilation and blocking proof QA
        run: |
          mkdir -p "${RUNNER_TEMP}/short-supplement-check"
          unzip -q submission/generated/jict_short_online_supplement_source.zip -d "${RUNNER_TEMP}/short-supplement-check"
          (cd "${RUNNER_TEMP}/short-supplement-check" && latexmk -pdf -interaction=nonstopmode -halt-on-error -bibtex- main.tex)
          pdftotext "${RUNNER_TEMP}/short-supplement-check/main.pdf" - | grep -F "Explicit Coalition-Deviation and Payoff Ledger"
          ! pdftotext "${RUNNER_TEMP}/short-supplement-check/main.pdf" - | grep -Eiq 'Ryota Matsuki|ryota.matsuki@gmail.com|github.com/ryotamatsuki'
          echo "SHORT SUPPLEMENT CLEAN ROOM: PASS"
      - name: Independent reconstruction from the actual replication ZIP
        run: |
          mkdir -p "${RUNNER_TEMP}/short-replication-check"
          unzip -q submission/generated/jict_short_replication_package_anonymous.zip -d "${RUNNER_TEMP}/short-replication-check"
          cd "${RUNNER_TEMP}/short-replication-check"
          python code/revision/check_jict_short_independent.py --json reproduced-certificates.json
          diff independent-certificates.json reproduced-certificates.json
          test -f formal/r7/R7Formal.lean
          test -f code/revision/check_r4_network_role.py
          test -f code/revision/check_r5_competition_portability.py
          for audit in check_network_zero check_r2_adoption check_r3_partial_erosion check_r4_network_role check_r5_competition_portability check_r6_coalition_stability check_r7_cleanroom check_r8_claim_scope check_r9_final_audit; do
            python "code/revision/${audit}.py"
          done
          make verify
      - name: Audit the final sources, anonymity, spacing, fonts and package
        run: python code/revision/audit_jict_short_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: jict-short-preview-${{ github.sha }}
          path: |
            submission/generated/jict_short_manuscript.pdf
            submission/generated/jict_short_online_supplement.pdf
            submission/generated/jict_short_source.zip
            submission/generated/jict_short_online_supplement_source.zip
            submission/generated/jict_short_identified_title_page.pdf
            submission/generated/jict_short_cover_letter.pdf
            submission/generated/jict_short_upload_manifest.md
            submission/generated/jict_short_identified_source.zip
            submission/generated/r9_jict_submission_set.zip
            submission/generated/r9_final_package_qa.json
            submission/generated/r9_final_source_changes.patch
            submission/generated/replication_package_anonymous.zip
            submission/generated/jict_short_replication_package_anonymous.zip
            submission/generated/ESM_1.pdf
            submission/generated/Fig1.eps
            build/final-polish/independent-certificates.json
          retention-days: 14
