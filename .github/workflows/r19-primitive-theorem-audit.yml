name: R19 Primitive Theorem and Adversarial Audit
on:
  push:
    branches: ['research/r19-primitive-theorem-discovery']
    paths:
      - 'research/r19/**'
      - '.github/workflows/r19-primitive-theorem-audit.yml'
  pull_request:
    paths:
      - 'research/r19/**'
      - '.github/workflows/r19-primitive-theorem-audit.yml'
permissions:
  contents: read
jobs:
  new-proof-certificates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned exact and numerical stack
        run: python -m pip install sympy==1.13.3 numpy==2.1.3 scipy==1.14.1
      - name: Protect all inherited blobs and verify R19 proofs and counterexamples
        run: python research/r19/verify_r19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r19-exact-certificates
          path: |
            research/r19/verification/
            research/r19/replay_work/bertrand_kink_certificate.json
            research/r19/replay_work/extra_counterfactuals.json
            research/r19/referee_work/independent_referee_results.json
  inherited-and-manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned proof and plotting stack
        run: python -m pip install sympy==1.13.3 numpy==2.1.3 scipy==1.14.1 matplotlib==3.10.8
      - name: Re-execute R9 failures and successes through R18, including all portfolios and price deviations
        run: python research/r19/replay_work/replay_inherited.py
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-publishers texlive-fonts-recommended poppler-utils
      - name: Build immutable R9 plus audited R19 proposal
        run: python research/r19/build_manuscript.py
      - name: Recheck every inherited source after build
        run: python -c "import runpy; runpy.run_path('research/r19/verify_r19.py')['preserve']()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r19-replay-and-proposed-manuscript
          path: |
            research/r19/replay_work/*stdout.txt
            research/r19/replay_work/*stderr.txt
            research/r19/replay_work/replay_results.json
            research/r19/replay_work/inherited_sha256.json
            build/r19-manuscript/
