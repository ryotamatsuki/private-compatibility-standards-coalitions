name: Paper CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Post-IJIO revision symbolic prechecks
        run: python code/revision/check_network_zero.py

      - name: R2 one-way adoption verification
        run: python code/revision/check_r2_adoption.py

      - name: R3 partial erosion verification
        run: python code/revision/check_r3_partial_erosion.py

      - name: R4 network-role verification
        run: python code/revision/check_r4_network_role.py

      - name: R5 competition-portability verification
        run: python code/revision/check_r5_competition_portability.py

      - name: R6 coalition-stability robustness verification
        run: python code/revision/check_r6_coalition_stability.py

      - name: R7 clean-room theory recertification
        run: python code/revision/check_r7_cleanroom.py

      - name: Install Lean 4
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: R7 targeted formal verification
        run: |
          cd formal/r7
          lake update
          lake exe cache get
          lake build Mathlib.Basic.Real.Basic Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Positivity Mathlib.Tactic.Ring
          lake env lean R7Formal.lean
          if grep -RInE '\\b(sorry|admit)\\b' --include='*.lean' .; then
            echo "Forbidden Lean placeholder found"
            exit 1
          fi
          echo "R7 FORMAL VERIFICATION: PASS"

      - name: R8 manuscript claim-scope audit
        run: python code/revision/check_r8_claim_scope.py

      - name: R9 final mathematical and claim audit
        run: python code/revision/check_r9_final_audit.py

      - name: Install LaTeX and PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-publishers \
            texlive-fonts-recommended \
            poppler-utils \
            unzip

      - name: Symbolic and numerical verification
        run: make verify

      - name: Generate figures
        run: make figures

      - name: Generate tables
        run: make tables

      - name: Syntax-check generated tables
        run: make tables-check

      - name: Compile canonical anonymous manuscript
        run: make paper

      - name: Report canonical manuscript page count
        run: |
          pdfinfo paper/main.pdf | grep '^Pages:'
          echo "R9 PAGE COUNT REPORT: complete"

      - name: Build and audit IJIO submission package
        run: make submission

      - name: Clean-room IJIO Editorial Manager source QA
        run: |
          QA_DIR="${RUNNER_TEMP}/ijio-em-source-qa"
          rm -rf "$QA_DIR"
          mkdir -p "$QA_DIR"
          unzip -q submission/generated/ijio_em_source.zip -d "$QA_DIR"
          if grep -qsE '\\cite[a-zA-Z*]*\{' "$QA_DIR"/*.tex && grep -qsE '^[[:space:]]*@' "$QA_DIR/references.bib"; then
            (cd "$QA_DIR" && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex)
          else
            (cd "$QA_DIR" && latexmk -pdf -interaction=nonstopmode -halt-on-error -bibtex- main.tex)
          fi
          pdftotext "$QA_DIR/main.pdf" - | grep -F "Ryota Matsuki"
          pdftotext "$QA_DIR/main.pdf" - | grep -F "Independent Researcher"
          pdftotext "$QA_DIR/main.pdf" - | grep -F "ryota.matsuki@gmail.com"
          echo "CLEAN-ROOM IJIO EM SOURCE QA: PASS"

      - name: Clean-room replication package QA
        run: |
          QA_DIR="${RUNNER_TEMP}/ijio-replication-qa"
          rm -rf "$QA_DIR"
          mkdir -p "$QA_DIR"
          unzip -q submission/generated/replication_package_anonymous.zip -d "$QA_DIR"
          make -C "$QA_DIR" verify
          make -C "$QA_DIR" figures
          make -C "$QA_DIR" tables
          make -C "$QA_DIR" tables-check
          make -C "$QA_DIR" paper
          echo "CLEAN-ROOM REPLICATION QA: PASS"

      - name: Upload manuscript audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-audit-${{ github.sha }}
          path: |
            paper/main.pdf
            paper/main.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload IJIO submission package
        uses: actions/upload-artifact@v4
        with:
          name: ijio-submission-${{ github.sha }}
          path: |
            submission/generated/manuscript.pdf
            submission/generated/manuscript_pdfinfo.txt
            submission/generated/ijio_em_source.zip
            submission/generated/cover_letter.pdf
            submission/generated/title_page.pdf
            submission/generated/replication_package_anonymous.zip
            submission/highlights.txt
            submission/metadata.md
            submission/declarations.md
            submission/checklist.md
            submission/reviewer_candidates.md
          if-no-files-found: error
          retention-days: 7
