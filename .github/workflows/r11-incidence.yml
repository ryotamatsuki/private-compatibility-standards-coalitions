name: R11 general incidence algebra audit
on:
  push:
    paths:
      - 'research/r11/**'
      - '.github/workflows/r11-incidence.yml'
  pull_request:
    paths:
      - 'research/r11/**'
      - '.github/workflows/r11-incidence.yml'
permissions:
  contents: read
jobs:
  model-free-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3
      - run: python research/r11/verify_general_incidence.py
