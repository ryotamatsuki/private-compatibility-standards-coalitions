name: R14 joint-country-size window exact inequalities
on:
  push:
    paths:
      - 'research/r14/**'
      - '.github/workflows/r14-country-size.yml'
  pull_request:
    paths:
      - 'research/r14/**'
      - '.github/workflows/r14-country-size.yml'
permissions:
  contents: read
jobs:
  exact-size-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3
      - run: python research/r14/verify_joint_size_window.py
