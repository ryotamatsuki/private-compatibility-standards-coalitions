name: R10 Cournot Bertrand frontier exact audit
on:
  push:
    paths:
      - 'research/frontier/**'
      - '.github/workflows/r10-frontier-exact.yml'
  pull_request:
    paths:
      - 'research/frontier/**'
      - '.github/workflows/r10-frontier-exact.yml'
permissions:
  contents: read
jobs:
  exact-reconstruction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic algebra
        run: python -m pip install sympy==1.13.3
      - name: Reconstruct member-welfare derivatives and all adoption deviations
        run: python research/frontier/r10_verify_joint_competition.py
