name: R13 fulfilled-expectations buyer foundation audit
on:
  push:
    paths:
      - 'research/r13/**'
      - 'paper/jict_short/short_04_incentives.tex'
      - '.github/workflows/r13-buyer-foundation.yml'
  pull_request:
    paths:
      - 'research/r13/**'
      - 'paper/jict_short/short_04_incentives.tex'
      - '.github/workflows/r13-buyer-foundation.yml'
permissions:
  contents: read
jobs:
  exact-microfoundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve existing R9 model, propositions, proofs and source
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          base='08d6e6adb1a90bdf03fa223c0961ac04620f0fa2'
          modified='paper/jict_short/short_04_incentives.tex'
          old=subprocess.check_output(['git','show',f'{base}:{modified}'])
          assert Path(modified).read_bytes().startswith(old)
          unchanged=['paper/jict_short/main.tex',
                     'paper/jict_short/short_01_introduction.tex',
                     'paper/jict_short/short_02_model.tex',
                     'paper/jict_short/short_03_adoption.tex',
                     'paper/jict_short/short_05_stability_scope.tex',
                     'paper/jict_short/short_06_discussion.tex',
                     'paper/jict_short/short_supplement_robustness.tex',
                     'paper/jict_short/short_supplement_blocking.tex',
                     'paper/preamble.tex',
                     'code/revision/build_jict_short.py']
          for path in unchanged:
              assert Path(path).read_bytes()==subprocess.check_output(
                  ['git','show',f'{base}:{path}']),path
          print('ORIGINAL R9 SCIENCE UNCHANGED: PASS')
          PY
      - run: python -m pip install sympy==1.13.3
      - name: Independently prove buyer optimizer and welfare identities
        run: python research/r13/verify_consumer_microfoundation.py
      - name: Recheck R12 incidence specialization
        run: python research/r12/verify_welfare_mapping.py
      - name: Recheck original exact adoption stage
        run: python research/r12/verify_r9_generic_adoption_dominance.py
      - name: Recheck integrated reversal on the unchanged canonical witness
        run: python research/r12/verify_r9_nonmonotone_incidence.py
